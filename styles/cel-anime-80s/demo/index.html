<!doctype html>
<html><head><meta charset="utf-8"><title>City Lights, 1987</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0;display:block}</style>
</head><body><canvas id="gl" width="1920" height="1080"></canvas>
<script>
// ── 视口等比装入（设计帧 1920×1080 → 当前帧 = 视口）────────────────────────────────
// 影片本体（多层景片 + 逐镜绝对坐标 + WebGL2 CRT 多 pass）按**固定设计帧 1920×1080** 绘制，一字未改。
// 本脚本只做一件事：当前帧不是 1920×1080 时，把**整张设计帧**等比装入（contain）并居中，留边露出
// 页面底色 #1f2446（= dub-styles.json#cel-anime-80s 的 palette.bg，夜景靛蓝；本片 CRT 底色是深蓝紫，
// 用深色留边而不是纯黑，避免「小图塞在大黑框里」）。
// ★ 只包**唯一的上屏画布** `#gl`；离屏画布由 cel.js 的 `document.createElement('canvas')` 造、从不入 DOM，
//   这里碰不到它们，绘制逻辑不受影响。
// ★ 1920×1080 时**完全不碰 DOM**（不建包装层、不设 transform、不改底色）⇒ 与改造前逐字节相同。
(function () {
  var NW = 1920, NH = 1080, BAND = '#1f2446', wrap = null;
  function unwrap() {                              // 回到设计帧尺寸：拆掉包装层，恢复原始 DOM
    if (!wrap) return;
    var p = wrap.parentNode;
    while (wrap.firstChild) p.insertBefore(wrap.firstChild, wrap);
    p.removeChild(wrap); wrap = null;
  }
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    if (W === NW && H === NH) {                    // 设计帧 = 当前帧 ⇒ 原样，底色还原成页面自己的 #000
      unwrap();
      document.documentElement.style.background = ''; document.body.style.background = '';
      return;
    }
    document.documentElement.style.background = BAND; document.body.style.background = BAND;
    var k = Math.min(W / NW, H / NH);              // 等比装入的紧轴缩放
    if (!wrap) {
      var gl = document.getElementById('gl');
      wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:0;top:0;width:' + NW + 'px;height:' + NH + 'px;transform-origin:0 0';
      gl.parentNode.insertBefore(wrap, gl); wrap.appendChild(gl);
    }
    wrap.style.transform = 'translate(' + ((W - k * NW) / 2) + 'px,' + ((H - k * NH) / 2) + 'px) scale(' + k + ')';
  }
  layout(); addEventListener('resize', layout);
})();
</script>
<script type="module" src="main.js"></script></body></html>
