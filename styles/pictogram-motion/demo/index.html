<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Inter Tight"; src: url(fonts/InterTightwght.ttf); font-weight: 100 900; }
@font-face { font-family: "Noto Sans SC"; src: url(fonts/NotoSansSCwght.ttf); font-weight: 100 900; }
@font-face { font-family: "Noto Sans JP"; src: url(fonts/NotoSansJPwght.ttf); font-weight: 100 900; }
@font-face { font-family: "DM Mono"; src: url(fonts/DMMono-Medium.ttf); font-weight: 500; }
html,body { margin:0; background:#000; overflow:hidden; }
canvas { display:block; width:1920px; height:1080px; }
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── 视口等比装入（设计帧 1920×1080 → 当前帧 = 视口）────────────────────────────
// 影片本体按**固定设计帧 1920×1080** 绘制，一字未改（#c 画布的位图与 CSS 尺寸都是 1920×1080）。
// 本脚本只做一件事：当前帧不是 1920×1080 时，把**整张设计帧**等比装入（contain）并居中，留边露出
// 本风格的**米白底色 #fbf6ec**（取自 palette 的 CREAM / 卡纸色；像把这张「卡」裱在米白纸上）。
// ★ 1920×1080 时**完全不碰 DOM**（不建包装层、不设 transform、不改底色）⇒ 与改造前逐字节相同；
//   也只有这一个页面外壳文件被改，任何「画布尺寸 = 设计帧」的 demo 都能照抄这个范式。
(function () {
  var NW = 1920, NH = 1080, BG = '#fbf6ec', wrap = null;
  function unwrap() {                              // 回到设计帧尺寸：拆掉包装层、还原底色
    if (!wrap) return;
    var p = wrap.parentNode;
    while (wrap.firstChild) p.insertBefore(wrap.firstChild, wrap);
    p.removeChild(wrap); wrap = null;
    document.documentElement.style.background = '';
    document.body.style.background = '';
  }
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    if (W === NW && H === NH) { unwrap(); return; }          // 设计帧 = 当前帧 ⇒ 原样
    var k = Math.min(W / NW, H / NH);                        // 等比装入的紧轴缩放
    if (!wrap) {
      var host = document.getElementById('c');
      wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:0;top:0;width:' + NW + 'px;height:' + NH + 'px;transform-origin:0 0';
      host.parentNode.insertBefore(wrap, host);
      wrap.appendChild(host);
    }
    wrap.style.transform = 'translate(' + ((W - k * NW) / 2) + 'px,' + ((H - k * NH) / 2) + 'px) scale(' + k + ')';
    document.documentElement.style.background = BG;
    document.body.style.background = BG;
  }
  layout(); addEventListener('resize', layout);
})();
</script>
<script src="edl.js"></script>
<script src="engine.js"></script>
<script src="poses/base.js"></script>
<script src="poses/ath.js"></script>
<script src="poses/aqua.js" onerror="0"></script>
<script src="poses/ball.js" onerror="0"></script>
<script src="poses/combat.js" onerror="0"></script>
<script src="poses/power.js" onerror="0"></script>
<script src="poses/nature.js" onerror="0"></script>
<script src="poses/asia.js" onerror="0"></script>
<script src="scenes.js"></script>
<script>
const ctx = document.getElementById('c').getContext('2d');
window.DUR = EDL.DUR;
window.render = (t) => G.renderFrame(ctx, t);
Promise.all([
  '900 40px "Inter Tight"', '800 40px "Inter Tight"', '500 40px "Noto Sans SC"', '900 40px "Noto Sans SC"', '700 40px "Noto Sans SC"',
  '500 40px "Noto Sans JP"', '700 40px "Noto Sans JP"', '500 20px "DM Mono"',
].map((f) => document.fonts.load(f, 'Aa第届亚洲运动会競技ここで'))).then(() => { render(0); window.READY = true; });
</script>
</body></html>
