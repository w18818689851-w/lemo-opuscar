<!doctype html>
<html><head><meta charset="utf-8"><title>Five-Second Astronaut</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0;display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── 视口等比装入（设计帧 1920×1080 → 当前帧 = 视口）────────────────────────────────
// 影片本体（main.js / film.js 与 8 个 g_*.js）按**固定设计帧 1920×1080** 绘制，一字未改（#c 就是 1920×1080）。
// 本脚本只做一件事：当前帧不是 1920×1080 时，把**整张设计帧**等比装入（contain）并居中，留边露出
// 本风格的底色 —— 家舞台深紫 #2a0f5c（P.deep，与片尾卡 / 舞台底同色，读成「电视外仍是演播厅」）。
// ★ 1920×1080 时**完全不碰 DOM**（不建包装层、不设 transform、底色清空回 CSS 的 #000）⇒ 与改造前逐字节相同。
(function () {
  var NW = 1920, NH = 1080, BAND = '#2a0f5c', wrap = null;
  function unwrap() {                              // 回到设计帧尺寸：拆掉包装层，恢复原始 DOM
    if (!wrap) return;
    var p = wrap.parentNode;
    while (wrap.firstChild) p.insertBefore(wrap.firstChild, wrap);
    p.removeChild(wrap); wrap = null;
  }
  function band(on) {                              // 留边色：html 背景传播到整个视口，body 一并设以防万一
    document.documentElement.style.background = on ? BAND : '';
    document.body.style.background = on ? BAND : '';
  }
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    if (W === NW && H === NH) { band(false); unwrap(); return; }   // 设计帧 = 当前帧 ⇒ 原样
    band(true);
    var k = Math.min(W / NW, H / NH);                              // 等比装入的紧轴缩放
    if (!wrap) {
      var c = document.getElementById('c');
      wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:0;top:0;width:' + NW + 'px;height:' + NH + 'px;transform-origin:0 0';
      c.parentNode.insertBefore(wrap, c); wrap.appendChild(c);
    }
    wrap.style.transform = 'translate(' + ((W - k * NW) / 2) + 'px,' + ((H - k * NH) / 2) + 'px) scale(' + k + ')';
  }
  layout(); addEventListener('resize', layout);
})();
</script>
<script type="module" src="main.js"></script></body></html>
