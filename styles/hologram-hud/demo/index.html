<!doctype html>
<html><head><meta charset="utf-8"><title>Volt · Spec Scan</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#02080A;overflow:hidden}canvas{position:absolute;left:0;top:0;display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── 视口等比装入（设计帧 1920×1080 → 当前帧 = 视口）────────────────────────────────
// 影片本体按**固定设计帧 1920×1080** 绘制，一字未改（#c 画布就是 1920×1080）。
// 本脚本只做一件事：当前帧不是 1920×1080 时，把**整张设计帧**等比装入（contain）并居中，留边露出
// 页面底色 #02080A（本风格的近黑舞台色，= 影片自己的 bg0 hsl(hue+12,70%,2.4%)，接缝看不出）。
// ★ 1920×1080 时**完全不碰 DOM**（不建包装层、不设 transform）⇒ 与改造前逐字节相同。
// 声明见 demo/film.js 的 FILM_META.aspects（控制台按源码文本探测）。
(function () {
  var NW = 1920, NH = 1080, wrap = null;
  function unwrap() {                              // 回到设计帧尺寸：拆掉包装层，恢复原始 DOM
    if (!wrap) return;
    var p = wrap.parentNode;
    while (wrap.firstChild) p.insertBefore(wrap.firstChild, wrap);
    p.removeChild(wrap); wrap = null;
  }
  function layout() {
    var W = window.innerWidth, H = window.innerHeight;
    if (W === NW && H === NH) { unwrap(); return; }          // 设计帧 = 当前帧 ⇒ 原样
    var k = Math.min(W / NW, H / NH);                        // 等比装入的紧轴缩放
    if (!wrap) {
      var cv = document.getElementById('c');
      wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;left:0;top:0;width:' + NW + 'px;height:' + NH + 'px;transform-origin:0 0';
      cv.parentNode.insertBefore(wrap, cv); wrap.appendChild(cv);
    }
    wrap.style.transform = 'translate(' + ((W - k * NW) / 2) + 'px,' + ((H - k * NH) / 2) + 'px) scale(' + k + ')';
  }
  layout(); addEventListener('resize', layout);
})();
</script>
<script type="module" src="main.js"></script></body></html>
